[project]
name = "cli-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.87.0",
    "docker>=7.1.0",
    "docstring-parser>=0.17.0",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.2",
    "fastembed>=0.8.0",
    "google-genai>=1.70.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "requests>=2.33.0",
    "uuid>=1.30",
    "uvicorn>=0.42.0",
]

[tool.pytest.ini_options]
# Only look here (faster, avoids large directory walks).
testpaths = ["src/tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "venv", "node_modules", "__pycache__", ".mypy_cache", ".ruff_cache"]
